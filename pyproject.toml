[project]
name = "lionheart"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.optional-dependencies]
test = ["pytest>=9.1.1", "numpy>=2.5.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recomp*", "tools*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
