name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: cmake -DPLATFORM=linux -P tools/ci_deps.cmake
      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Build the player and synthetic harnesses
        run: cmake -S . -B build && cmake --build build -j8
      - name: Run tests without discs
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          FF8_PLAYER_HOST: ${{ github.workspace }}/build/lionheart
        run: python -m pytest -q -m 'not game and not realtime'
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install cross-build prerequisites
        run: cmake -DPLATFORM=windows -P tools/ci_deps.cmake
      - uses: actions/cache@v4
        with:
          path: |
            build/windows-deps
            build/downloads
          key: windows-ucrt-${{ runner.os }}-${{ hashFiles('tools/windows-deps.json', 'tools/*windows*.cmake', 'tools/release_common.cmake', 'tools/stage_player.cmake', 'cmake/toolchains/windows-llvm-mingw.cmake') }}
      - name: Cross-build and stage player
        run: cmake -DJOBS=4 -P tools/build_windows.cmake
