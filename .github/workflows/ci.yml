name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: cmake -DPLATFORM=linux -P tools/ci_deps.cmake
      - name: Build the player
        run: cmake -S . -B build && cmake --build build -j4
      - name: Build native tests
        run: cmake -S tests/native -B build/native-tests && cmake --build build/native-tests -j4
      - name: Run tests without discs
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          FF8_PLAYER_HOST: ${{ github.workspace }}/build/lionheart
        run: ctest --test-dir build/native-tests -j4 --output-on-failure -LE 'game|realtime'
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-build prerequisites
        run: cmake -DPLATFORM=windows -P tools/ci_deps.cmake
      - uses: actions/cache@v4
        with:
          path: |
            build/windows-deps
            build/downloads
          key: windows-ucrt-${{ runner.os }}-${{ hashFiles('tools/windows-deps.json', 'tools/*windows*.cmake', 'tools/release_common.cmake', 'tools/stage_player.cmake', 'cmake/toolchains/windows-llvm-mingw.cmake') }}
      - name: Cross-build and stage player
        run: cmake -DJOBS=4 -P tools/build_windows.cmake
      # The runner and its process helpers require POSIX. Cross-target executable
      # cases need Wine; DLL cases cannot load into the Linux host runner.
      - name: Check native cross-build tools
        run: cmake -S tools/player-check -B build/player-check && cmake --build build/player-check -j4
